<!doctype html>
<html lang="en">
<meta charset="utf-8">
<style>
  body { margin: 16px; font: 13px/1.5 system-ui, sans-serif; color: #222; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  button { padding: 7px 10px; margin: 0 4px 6px 0; }
  textarea { width: 100%; height: 245px; box-sizing: border-box; font: 11px/1.4 monospace; }
  #status { min-height: 40px; }
</style>
<h1>Fixture Analyzer</h1>
<p>Select one container to measure its structure. Reports contain aggregate metrics, scope IDs, and hidden-layer coverage.</p>
<button id="selection">Analyze selection</button>
<button id="page">Analyze current page</button>
<p id="status" role="status">Limits: 10,000 nodes, 2 MB records, 5 seconds, 250,000 pair checks.</p>
<textarea id="output" aria-label="Aggregate measurement report" readonly></textarea>
<p><button id="download" disabled>Download report</button></p>
<script>
  const selection = document.getElementById('selection');
  const page = document.getElementById('page');
  const download = document.getElementById('download');
  const output = document.getElementById('output');
  const status = document.getElementById('status');
  function request(type) {
    selection.disabled = page.disabled = true;
    download.disabled = true;
    output.value = '';
    status.textContent = 'Analyzing the chosen scope…';
    parent.postMessage({ pluginMessage: { type } }, '*');
  }
  selection.onclick = () => request('analyze-selection');
  page.onclick = () => request('analyze-page');
  window.onmessage = (event) => {
    if (event.source !== parent) return;
    const message = event.data.pluginMessage;
    if (!message) return;
    if (message.type === 'result') {
      output.value = JSON.stringify(message.report, null, 2);
      status.textContent = 'Report ready. Check completeness fields before interpreting scope totals.';
      download.disabled = false;
      selection.disabled = page.disabled = false;
    } else if (message.type === 'error') {
      status.textContent = message.message;
      selection.disabled = page.disabled = false;
    }
  };
  download.onclick = () => {
    const url = URL.createObjectURL(new Blob([output.value], { type: 'application/json' }));
    const link = document.createElement('a');
    link.href = url;
    link.download = 'fixture-measurement.json';
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };
</script>
</html>
