<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body { margin:0; padding:24px; font:13px/1.5 system-ui,sans-serif; background:var(--figma-color-bg,#fff); color:var(--figma-color-text,#18202b); }
  h1 { font-size:18px; margin:0 0 8px; letter-spacing:-.3px; }
  p { margin:0 0 16px; color:var(--figma-color-text-secondary,#667085); }
  label { display:block; margin:0 0 6px; font-weight:600; }
  .language { display:flex; gap:8px; align-items:center; justify-content:flex-end; margin:0 0 12px; }
  .language label { margin:0; font-size:12px; }
  select { font:inherit; color:inherit; background:var(--figma-color-bg,#fff); border:1px solid var(--figma-color-border,#d0d5dd); border-radius:4px; padding:4px; }
  #locale-notice { margin:8px 0 0; font-size:12px; }
  input { display:block; width:100%; padding:10px; border:1px solid var(--figma-color-border,#d0d5dd); background:var(--figma-color-bg,#fff); color:inherit; border-radius:6px; }
  .actions { display:flex; gap:8px; margin:12px 0 20px; }
  button { border:0; border-radius:6px; background:#285dde; color:white; padding:9px 15px; font:inherit; font-weight:600; cursor:pointer; }
  button.secondary { color:inherit; background:var(--figma-color-bg-secondary,#eef1f6); }
  button:disabled { opacity:.5; cursor:default; }
  .connection { display:flex; align-items:baseline; gap:8px; }
  #indicator { flex:none; width:8px; height:8px; border-radius:50%; background:#98a2b3; }
  #indicator[data-state="connected"] { background:#12b76a; }
  #indicator[data-state="connecting"],#indicator[data-state="reconnecting"] { background:#f79009; }
  #status { margin:0; font-size:12px; }
</style>
<div class="language"><label id="locale-label" for="locale">Language</label><select id="locale"><option value="ko">한국어</option><option value="en">English</option></select></div>
<h1>Figma Semantic Bridge</h1>
<p id="introduction">Open Figma Semantic Bridge on this Mac. Copy the pairing token from its Bridge menu and connect below. Keep this plugin open while you work in the app.</p>
<label id="token-label" for="token">Pairing token</label>
<input id="token" type="password" autocomplete="off" minlength="32" maxlength="1024" placeholder="Bridge → Copy Pairing Token" spellcheck="false">
<div class="actions"><button id="connect">Connect</button><button class="secondary" id="disconnect" disabled>Disconnect</button></div>
<div class="connection"><span id="indicator" data-state="disconnected"></span><p id="status" role="status">Disconnected. Your Figma document remains unchanged.</p></div>
<p id="locale-notice" role="status"></p>
<!-- BRIDGE_SCRIPT -->
</html>
